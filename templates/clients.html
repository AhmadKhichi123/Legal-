{% extends "base.html" %}
{% block content %}
<div class="heading">
    <h1>Clients</h1>
    <a class="btn" href="{{ url_for('client_new') }}">+ New client</a>
</div>

<form class="filters">
    <input type="search" name="q" value="{{ q }}" placeholder="Filter by name, CNIC, phone or email">
    <button class="btn secondary">Filter</button>
</form>

<div class="card">
    {% if clients %}
    <table>
        <tr><th>Name</th><th>CNIC</th><th>Phone</th><th>Email</th><th>Cases</th></tr>
        {% for c in clients %}
        <tr>
            <td><a href="{{ url_for('client_detail', client_id=c.id) }}">{{ c.name }}</a></td>
            <td>{{ c.cnic or "" }}</td>
            <td>{{ c.phone }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.case_count }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <p class="muted">No clients found.</p>
    {% endif %}
</div>
{% endblock %}
