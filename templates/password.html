{% extends "base.html" %}
{% block content %}
<div class="card narrow">
    <h1>Change password</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
        <label>Current password <input type="password" name="current" required autofocus></label>
        <label>New password <input type="password" name="new" required minlength="8"></label>
        <label>Confirm new password <input type="password" name="confirm" required minlength="8"></label>
        <button class="btn">Change password</button>
        <a class="btn secondary" href="{{ url_for('dashboard') }}">Cancel</a>
    </form>
</div>
{% endblock %}
