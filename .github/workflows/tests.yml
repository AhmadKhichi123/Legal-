# Runs the automated tests on GitHub every time code is pushed,
# so a broken change is spotted straight away (green tick = all tests pass).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install libraries
        run: pip install -r requirements.txt
      - name: Run the 60 automated checks
        run: python test_app.py
      - name: Run the speed test
        run: python perf_test.py
      - name: Check the single-file edition builds
        run: python tools/make_single_file.py && python -m py_compile dist/legal_cms.py
